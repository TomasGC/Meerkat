apiVersion: v1
kind: Pod
metadata:
  name: order-service
spec:
  hostNetwork: true
  containers:
    - name: app
      image: order-service:1.0
      securityContext:
        privileged: true
      resources: {}
      env:
        - name: MODE
          value: production
      ports:
        - containerPort: 8080
          hostPort: 8080
