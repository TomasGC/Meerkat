[pytest]
# Test roots repeat module names across trees (several unit/test_cache.py): the
# default prepend mode binds the first one imported and the rest fail to resolve.
addopts = --import-mode=importlib
# One tests/ tree per component (#46): <component>/tests/{unit,integration_mock,integration_real,e2e}
testpaths =
    agents/black-box-analyzer/tests
    agents/clean-code-analyzer/tests
    agents/security-safety-analyzer/tests
    skills/search-tech/tests
    scripts/lib/tests
    scripts/cli/tests
    tests

# Tier markers carry the name of the tier directory; the root conftest.py applies them.
markers =
    unit: pure in-process tests (no I/O, all mocked)
    integration_mock: mocked subprocess/tools
    integration_real: real Ollama or real filesystem outside tmp_path
    e2e: subprocess.run on actual scripts
    e2e_scripts: e2e subset — CLI scripts
    e2e_agents: e2e subset — agents
    e2e_skills: e2e subset — skills
    requires_git: needs a real git binary on PATH
    live_ai: needs the configured local AI server; skipped by the real-tier conftest when it is down
    slow: takes more than 5 seconds
