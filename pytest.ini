[pytest]
# Test roots repeat package names across trees (two e2e/, several tests/): the
# default prepend mode binds the first one imported and the rest fail to resolve.
addopts = --import-mode=importlib
testpaths =
    agents/black-box-analyzer/tests
    scripts/tests
    scripts/cli/tests
    scripts/cli/agents/task_monitor/tests
    scripts/lib/tests
    scripts/lib/cli/tests
    agents/tests

markers =
    units: pure in-process tests (no I/O, all mocked)
    integration_mocks: mocked subprocess/tools
    integration_reals: real Ollama or real filesystem outside tmp_path
    e2e: subprocess.run on actual scripts
    e2e_scripts: e2e subset — CLI scripts
    e2e_agents: e2e subset — agents
    e2e_skills: e2e subset — skills
    requires_git: needs a real git binary on PATH

# NOTE: BBA, CCA, SSA and skills/search-tech each have their own package named
# 'common'. importlib mode fixes duplicate *module* names, not duplicate package
# names, so only one of the four can be on sys.path per run. BBA is the one in
# testpaths above; the other three run from their own directory:
#   cd agents/clean-code-analyzer/scripts && python -m pytest tests/ -q
#   cd agents/security-safety-analyzer/scripts && python -m pytest tests/ -q
#   cd skills/search-tech/scripts && python -m pytest tests/ -q
