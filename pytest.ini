[pytest]
testpaths =
    agents/black-box-analyzer/tests
    scripts/tests
    scripts/cli/tests
    scripts/cli/agents/ci_fix_proposer/tests
    scripts/cli/agents/code_analyzer/tests
    scripts/cli/skills/analyze_commit/tests
    scripts/common/tests
    scripts/common/cli/tests
    agents/tests

markers =
    units: pure in-process tests (no I/O, all mocked)
    integration_mocks: mocked subprocess/tools
    integration_reals: real Ollama or real filesystem outside tmp_path
    e2e: subprocess.run on actual scripts

# NOTE: agents/black-box-analyzer and scripts/tests share a 'common' package namespace.
# Run them together only with --import-mode=importlib, or separately:
#   pytest agents/black-box-analyzer/tests -m units
#   pytest scripts/tests -m units
