name: PR-CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: TomasGC/Condor/.github/workflows/common-pr-ci.yml@main
    # Meerkat keeps its context files in contexts/ and its code in Python.
    with:
      contexts-dir: contexts
      code-paths: '\.py$'
      test-paths: '(^|/)tests/'
