service: my-serverless-app

provider:
  name: aws
  runtime: python3.11
  region: us-east-1

functions:
  api:
    handler: lambda_handler.lambda_handler
    events:
      - http:
          path: users/{userId}
          method: get

  scheduled:
    handler: lambda_handler.scheduled_handler
    events:
      - schedule: rate(1 hour)

  sqsProcessor:
    handler: lambda_handler.sqs_handler
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-1:123456789012:MyQueue
