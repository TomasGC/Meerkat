[pytest]
markers =
    unit: Fast unit tests, no external deps
    integration: Integration tests
    integration_mock: Integration tests with mocked external services
    integration_real: Requires real Ollama on localhost:11434
    e2e: End-to-end tests requiring Docker
    slow: Tests taking more than 5 seconds (deselect with -m "not slow")
    repeat: Run test N times (pytest-repeat)

addopts = -v --tb=short

filterwarnings = ignore::DeprecationWarning
