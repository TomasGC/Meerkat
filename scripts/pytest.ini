[pytest]
# Pytest configuration for scripts

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Custom markers for platform-specific tests
markers =
    unix: Tests that only run on Unix-like systems (Linux, macOS)
    windows: Tests that only run on Windows
    linux: Tests that only run on Linux
    macos: Tests that only run on macOS
    requires_shellcheck: Tests that require shellcheck binary
    requires_git: Tests that require git repository
    slow: Tests that take more than 1 second
    integration: Integration tests (not unit tests)

# Test paths
testpaths = tests

# Coverage options (if using pytest-cov)
[coverage:run]
source = .
omit =
    tests/*
    */test_*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
